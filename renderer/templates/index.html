<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMA Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">
    <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">CMA Assistant</h1>
            <p class="text-gray-600">Generate compliance-safe CMA reports from your notes</p>
        </div>

        <!-- Main Form -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-8">
                <form action="/ui/generate" method="POST" id="generate-form" class="space-y-6">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label for="notes" class="block text-sm font-medium text-gray-700">Property Notes</label>
                            <button type="button" id="use-sample" class="text-xs text-indigo-600 hover:text-indigo-700 font-medium">Use sample notes</button>
                        </div>
                        <textarea 
                            id="notes" 
                            name="notes" 
                            rows="12" 
                            class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-4 border bg-gray-50 font-mono text-gray-800"
                            placeholder="Paste your property notes here (e.g., 'Looking for 3 bed/2 bath in Denver...')"
                            required
                            minlength="10"
                        ></textarea>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <div class="text-xs text-gray-500 flex items-center">
                            <svg class="h-4 w-4 mr-1 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            Using mock listing data
                        </div>
                        <button 
                            type="submit" 
                            id="submit-btn"
                            class="inline-flex justify-center rounded-md border border-transparent bg-indigo-600 py-2.5 px-6 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                        >
                            Generate Report
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Disclaimer -->
            <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 flex items-start gap-3">
                <svg class="h-5 w-5 text-amber-500 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <div>
                    <h4 class="text-xs font-semibold text-gray-900 uppercase tracking-wide">Draft / Internal Use Only</h4>
                    <p class="text-xs text-gray-500 mt-1">This tool generates draft reports based on data availability. Verify all values before sharing with clients.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent mb-4"></div>
            <h3 class="text-lg font-medium text-gray-900">Generating Report...</h3>
            <p class="text-sm text-gray-500 mt-1">Analyzing notes and searching comparables</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('generate-form');
        const submitBtn = document.getElementById('submit-btn');
        const loadingOverlay = document.getElementById('loading-overlay');
        const useSampleBtn = document.getElementById('use-sample');
        const notesArea = document.getElementById('notes');

        // Handle form submission
        form.addEventListener('submit', (e) => {
            // Show loading state
            submitBtn.disabled = true;
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');
        });

        // Handle sample notes
        useSampleBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/ui/sample');
                if (response.ok) {
                    const text = await response.text();
                    notesArea.value = text;
                }
            } catch (error) {
                console.error('Failed to load sample notes:', error);
            }
        });
    </script>
</body>
</html>
