{% extends "base.html" %}

{% block title %}CMA Report - Generated - {{ report_id }}{% endblock %}

{% block content %}
<!-- Navigation -->
<div class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-14">
            <div class="flex items-center">
                <a href="/ui" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 flex items-center">
                    &larr; Start Over
                </a>
            </div>
            <div class="flex items-center">
                <span
                    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                    verified
                </span>
                <span class="ml-3 text-xs text-gray-500">Generated just now</span>
            </div>
        </div>
    </div>
</div>

<main class="py-8 bg-gray-100">
    <div class="max-w-5xl mx-auto sm:px-6 lg:px-8">

        <!-- Action Bar -->
        <div class="mb-6 flex justify-end gap-2 px-4 sm:px-0">
            <button onclick="window.print()"
                class="inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                Print / Save PDF
            </button>
        </div>

        <!-- Main Report Content -->
        <!-- Note: The inner HTML has its own internal styles, but we wrap it here -->
        <div class="bg-white shadow-xl rounded-lg overflow-hidden border border-gray-200">
            <div class="p-0 report-content">
                {{ report_html | safe }}
            </div>
        </div>
    </div>
</main>
{% endblock %}
